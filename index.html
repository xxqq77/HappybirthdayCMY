<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>专属小提问</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #0d0b1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* 画布承载烟花 */
  #fireworksCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* 霓虹背景光晕 */
  .bg-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.4;
    z-index: 0;
    animation: floatGlow 12s ease-in-out infinite alternate;
  }
  .glow-pink { width: 400px; height: 400px; background: #ff007f; top: -100px; left: -100px; }
  .glow-blue { width: 350px; height: 350px; background: #00e5ff; bottom: -100px; right: -100px; animation-delay: -6s; }
  
  @keyframes floatGlow {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 50px) scale(1.3); }
  }

  /* 主卡片 */
  .card {
    position: relative;
    z-index: 2;
    background: rgba(20, 15, 35, 0.65);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 28px;
    padding: 48px 36px 40px;
    max-width: 90vw;
    width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(0, 229, 255, 0.1) inset;
    transition: transform 0.4s ease;
  }
  .card:hover { transform: translateY(-5px); }

  h1 {
    font-size: 22px;
    line-height: 1.8;
    color: #ffffff;
    margin-bottom: 40px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  h1 .name {
    color: #00e5ff;
    text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff, 0 0 40px #00e5ff;
    font-weight: 900;
  }

  /* 按钮容器 */
  .btns {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  button {
    font-family: inherit;
    font-weight: 800;
    cursor: pointer;
    border: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    outline: none;
  }

  /* 酷炫“是”按钮 */
  .yes {
    font-size: 26px;
    padding: 22px 65px;
    color: #fff;
    border-radius: 50px;
    background: linear-gradient(90deg, #ff007f, #7f00ff, #00e5ff);
    background-size: 200% auto;
    box-shadow: 0 0 20px rgba(255, 0, 127, 0.6),
                0 0 40px rgba(127, 0, 255, 0.4),
                0 0 60px rgba(0, 229, 255, 0.2);
    animation: pulseGlow 2s infinite alternate, gradientMove 3s infinite alternate;
    position: relative;
    overflow: hidden;
  }
  .yes:hover { transform: scale(1.08) translateY(-3px); }
  .yes:active { transform: scale(0.95); }

  @keyframes pulseGlow {
    0% { box-shadow: 0 0 20px rgba(255, 0, 127, 0.6), 0 0 40px rgba(127, 0, 255, 0.4); }
    100% { box-shadow: 0 0 30px rgba(255, 0, 127, 0.9), 0 0 60px rgba(127, 0, 255, 0.7), 0 0 80px rgba(0, 229, 255, 0.5); }
  }
  @keyframes gradientMove {
    0% { background-position: 0% center; }
    100% { background-position: 100% center; }
  }

  /* 极简“否”按钮 */
  .no {
    font-size: 14px;
    padding: 12px 30px;
    color: #8a8a9e;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50px;
    letter-spacing: 2px;
    opacity: 0.7;
  }
  .no:hover { color: #fff; border-color: rgba(255, 255, 255, 0.4); opacity: 1; transform: scale(1.05); }
  .no:active { transform: scale(0.95); }

  /* 结果文字 */
  .result {
    margin-top: 30px;
    min-height: 35px;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    opacity: 0;
    transform: scale(0.8);
    letter-spacing: 2px;
  }
  .result.show {
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.5); filter: blur(10px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .result.yes-msg {
    color: #00e5ff;
    text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff, 0 0 40px #00e5ff;
  }
  .result.no-msg {
    color: #ff007f;
    text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
    font-size: 20px;
  }
</style>
</head>
<body>

  <canvas id="fireworksCanvas"></canvas>
  <div class="bg-glow glow-pink"></div>
  <div class="bg-glow glow-blue"></div>

  <div class="card">
    <h1><span class="name">王心淇</span> 是你最最最最最最好的朋友吗？</h1>
    <div class="btns">
      <button class="yes" id="yesBtn">是</button>
      <button class="no" id="noBtn">否</button>
    </div>
    <div class="result" id="result"></div>
  </div>

<script>
  // --- 烟花粒子系统 ---
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animationFrameId;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function createFirework(x, y) {
    const colors = ['#ff007f', '#00e5ff', '#7f00ff', '#ffffff', '#ffea00'];
    const particleCount = 80;
    
    for (let i = 0; i < particleCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      const color = colors[Math.floor(Math.random() * colors.length)];
      
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: Math.random() * 0.02 + 0.015,
        color: color,
        size: Math.random() * 3 + 2
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15; // 重力
      p.vx *= 0.98; // 空气阻力
      p.vy *= 0.98;
      p.life -= p.decay;
      
      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }
  }

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.shadowBlur = 15;
      ctx.shadowColor = p.color;
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function loop() {
    updateParticles();
    drawParticles();
    animationFrameId = requestAnimationFrame(loop);
  }
  loop();

  // --- 交互逻辑 ---
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const result = document.getElementById('result');

  function showResult(text, isYes) {
    result.textContent = text;
    result.className = 'result'; // 重置类
    void result.offsetWidth; // 触发重绘
    result.classList.add('show');
    result.classList.add(isYes ? 'yes-msg' : 'no-msg');
  }

  yesBtn.addEventListener('click', (e) => {
    // 在按钮位置生成烟花
    const rect = e.target.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    createFirework(x, y);
    
    // 连炸效果
    setTimeout(() => createFirework(x - 80, y - 50), 150);
    setTimeout(() => createFirework(x + 80, y - 50), 300);

    showResult('有眼光', true);
  });

  noBtn.addEventListener('click', () => {
    showResult('你点错了。。', false);
  });
</script>
</body>
</身体>
