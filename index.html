<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问答</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #fff8fb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            padding: 20px;
            overflow-x: hidden;
        }

        .question {
            font-size: 24px;
            color: #442233;
            text-align: center;
            font-weight: 500;
            line-height: 1.6;
        }

        .btn-wrap {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .btn-yes {
            padding: 24px 60px;
            font-size: 26px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #ffb8d0, #ffadd6);
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 22px rgba(255,160,200,0.35);
            transition: 0.2s ease;
            cursor: pointer;
        }
        .btn-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(255,160,200,0.45);
        }

        .btn-no {
            padding: 6px 12px;
            font-size:13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ffb8d0, #ffadd6);
            color: white;
            box-shadow: 0 3px 8px rgba(255,160,200,0.25);
            cursor: pointer;
        }

        .result-text {
            font-size: 28px;
            color:#d86090;
            font-weight: bold;
            height:40px;
        }

        canvas {
            position: fixed;
            top: 0;
            left:0;
            width:100%;
            height:100%;
            pointer-events:none;
            z-index:-1;
        }
    </style>
</head>
<body>
    <canvas id="fireworkCanvas"></canvas>
    <div class="question">王心淇是你最最最最最最好的朋友吗？</div>
    <div class="btn-wrap">
        <button class="btn-yes" onclick="showResult('yes')">是</button>
        <button class="btn-no" onclick="showResult('no')">否</button>
    </div>
    <div class="result-text" id="msg"></div>

<script>
const canvas = document.getElementById("fireworkCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize',()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
})

let fireworks = [];
class Particle {
    constructor(x,y,color){
        this.x = x;
        this.y = y;
        this.speed = Math.random()*5+2;
        this.angle = Math.random()*Math.PI*2;
        this.gravity = 0.06;
        this.vx = Math.cos(this.angle)*this.speed;
        this.vy = Math.sin(this.angle)*this.speed;
        this.alpha = 1;
        this.color = color;
    }
    update(){
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -=0.015;
    }
    draw(){
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x,this.y,3,0,Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.restore();
    }
}

function createFirework(x,y){
    const colors = ['#ffb8d0','#ffadd6','#ff88bb','#ffe1f0','#f8a8cc'];
    const color = colors[Math.floor(Math.random()*colors.length)];
    for(let i=0;i<80;i++){
        fireworks.push(new Particle(x,y,color))
    }
}

function animate(){
    requestAnimationFrame(animate);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=fireworks.length-1;i>=0;i--){
        fireworks[i].update();
        fireworks[i].draw();
        if(fireworks[i].alpha <= 0){
            fireworks.splice(i,1);
        }
    }
}
animate();

function showResult(type){
    const msgDom = document.getElementById('msg');
    if(type === 'yes'){
        msgDom.innerText = "有眼光";
        createFirework(window.innerWidth/2, window.innerHeight/2);
    }else{
        msgDom.innerText = "你点错了。。";
    }
}
</script>
</body>
</html>
