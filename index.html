<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>专属小提问</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #fafafa;
    background-image: radial-gradient(#f1e5ec 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    position: relative;
  }

  .hidden { display: none !important; }

  /* --- 屏幕1：提问界面 --- */
  .screen1 {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 20px;
    z-index: 10;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .screen1.fade-out {
    opacity: 0;
    transform: scale(0.95);
    pointer-events: none;
  }

  h1 {
    font-size: 24px;
    line-height: 1.6;
    color: #5a4a54;
    margin-bottom: 50px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.5px;
  }
  h1 .name {
    color: #ff7eb3;
    font-weight: 800;
  }

  .btns {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* 粉色对话气泡按钮 */
  .yes {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    background: #f8b0c7;
    padding: 22px 60px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    position: relative;
    box-shadow: 0 8px 20px rgba(248, 176, 199, 0.4), 0 2px 6px rgba(248, 176, 199, 0.2);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    letter-spacing: 2px;
  }
  .yes:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 12px 28px rgba(248, 176, 199, 0.6);
  }
  .yes:active { transform: translateY(0) scale(0.96); }
  .yes::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 24px;
    width: 20px;
    height: 20px;
    background: #f8b0c7;
    clip-path: polygon(0 0, 100% 0, 0 100%);
    transform: skewX(-15deg);
  }

  .no {
    font-size: 13px;
    font-weight: 600;
    color: #b0a0ac;
    background: transparent;
    border: 1px solid #e0d0dc;
    padding: 10px 28px;
    border-radius: 50px;
    cursor: pointer;
    opacity: 0.8;
    letter-spacing: 2px;
    transition: all 0.3s ease;
  }
  .no:hover { border-color: #ff7eb3; color: #ff7eb3; opacity: 1; transform: scale(1.05); }
  .no:active { transform: scale(0.95); }

  /* 结果容器 */
  .result-box {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    min-height: 100px;
    justify-content: center;
  }

  .result-text {
    font-size: 22px;
    font-weight: 800;
    color: #ff7eb3;
    opacity: 0;
    transform: scale(0.8);
  }
  .result-text.show { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.6); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* 结果图片 */
  .result-img {
    max-width: 160px;
    height: auto;
    opacity: 0;
    transform: scale(0.5);
    pointer-events: none;
  }
  .result-img.show {
    animation: imgPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  @keyframes imgPop {
    0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* 缓慢放大效果（点“否”时使用） */
  .result-img.slow-zoom {
    animation: imgSlowZoom 3s ease-in-out forwards !important;
  }
  @keyframes imgSlowZoom {
    0%   { opacity: 0; transform: scale(0.3); }
    20%  { opacity: 1; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(2.2); }
  }

  /* --- 屏幕2：生日祝福界面 --- */
  .screen2 {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fefdfe;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  .screen2.active {
    opacity: 1;
    pointer-events: auto;
  }

  .header-title {
    font-size: 26px;
    font-weight: 800;
    color: #4a3e46;
    margin-bottom: 40px;
    z-index: 25;
    letter-spacing: 2px;
    text-shadow: 0 4px 10px rgba(248, 176, 199, 0.4);
  }

  /* 满屏飘落的祝福文字 */
  .floating-text {
    position: absolute;
    font-size: 20px;
    font-weight: 800;
    color: #ff7eb3;
    white-space: nowrap;
    pointer-events: none;
    z-index: 30;
    animation: floatUp 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    text-shadow: 0 2px 8px rgba(248, 176, 199, 0.3);
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(var(--rot)) scale(0.8); opacity: 0; }
    10%  { opacity: 1; }
    80%  { opacity: 0.9; }
    100% { transform: translateY(-20vh) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }

  /* 背景光晕 */
  .bg-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    z-index: 15;
    pointer-events: none;
  }
  .glow1 { width: 250px; height: 250px; background: #ffd1e8; top: 10%; left: 10%; }
  .glow2 { width: 300px; height: 300px; background: #e8d4ff; bottom: 10%; right: 10%; }
  .glow3 { width: 200px; height: 200px; background: #d4e8ff; top: 50%; left: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>

  <!-- 屏幕1：提问 -->
  <div class="screen1" id="screen1">
    <h1><span class="name">王心淇</span> 是你最最最最最最好的朋友吗？</h1>
    <div class="btns">
      <button class="yes" id="yesBtn">是</button>
      <button class="no" id="noBtn">否</button>
    </div>
    <div class="result-box" id="resultBox">
      <div class="result-text" id="resultText"></div>
      <img class="result-img" id="resultImg" src="" alt="">
    </div>
  </div>

  <!-- 屏幕2：生日界面 -->
  <div class="screen2" id="screen2">
    <!-- 背景光晕 -->
    <div class="bg-glow glow1"></div>
    <div class="bg-glow glow2"></div>
    <div class="bg-glow glow3"></div>

    <!-- 核心提示文案 -->
    <div class="header-title" id="headerTitle">好了，你可以打开了</div>
  </div>

<script>
  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const resultText = document.getElementById('resultText');
  const resultImg = document.getElementById('resultImg');
  const resultBox = document.getElementById('resultBox');
  
  let floatingInterval = null;

  // 显示结果函数
  function showResult(text, imgSrc, useSlowZoom) {
    // 重置状态
    resultText.classList.remove('show');
    resultImg.classList.remove('show', 'slow-zoom');
    void resultText.offsetWidth;
    void resultImg.offsetWidth;

    // 设置文字
    if (text) {
      resultText.textContent = text;
      resultText.classList.add('show');
    }

    // 设置图片
    if (imgSrc) {
      resultImg.src = imgSrc;
      resultImg.style.display = 'block';
      if (useSlowZoom) {
        resultImg.classList.add('slow-zoom');
      } else {
        resultImg.classList.add('show');
      }
    } else {
      resultImg.style.display = 'none';
    }
  }

  // 点“是”
  yesBtn.addEventListener('click', () => {
    showResult('有眼光 ✨', 'https://i.imgur.com/cV6bGa3.png', false);
    
    setTimeout(() => {
      screen1.classList.add('fade-out');
      
      setTimeout(() => {
        screen1.classList.add('hidden');
        screen2.classList.add('active');
        startBirthdayRain();
      }, 600);
    }, 1500); // 1.5秒后跳转
  });

  // 点“否”
  noBtn.addEventListener('click', () => {
    showResult('我不信', 'https://i.imgur.com/fiASgCD.png', true);
  });

  // 满屏飘落“崔梦悦，生日快乐！🎂”特效
  function startBirthdayRain() {
    if (floatingInterval) clearInterval(floatingInterval);
    
    const textStr = '崔梦悦，生日快乐！🎂';
    const colors = ['#ff7eb3', '#f8b0c7', '#b3d4ff', '#d4b3ff', '#ffb3d4'];
    
    floatingInterval = setInterval(() => {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = textStr;
      
      const randomLeft = Math.random() * 80 + 'vw';
      const randomDelay = Math.random() * 0.5 + 's';
      const randomScale = Math.random() * 0.6 + 0.7;
      const randomRotate = (Math.random() * 20 - 10) + 'deg';
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      
      el.style.left = randomLeft;
      el.style.animationDelay = randomDelay;
      el.style.setProperty('--rot', randomRotate);
      el.style.transform = `scale(${randomScale})`;
      el.style.color = randomColor;
      el.style.textShadow = `0 2px 10px ${randomColor}66`;
      
      screen2.appendChild(el);
      
      setTimeout(() => {
        if (el.parentNode) el.remove();
      }, 5000);
      
    }, 350);
  }
</script>
</body>
</html>
