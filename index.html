<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>崔梦悦心想事成</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 手账网格纸背景 */
    background-color: #f7f8fa;
    background-image:
      linear-gradient(rgba(200, 200, 200, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200, 200, 200, 0.15) 1px, transparent 1px);
    background-size: 20px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    position: relative;
  }

  .hidden { display: none !important; }

  /* --- 屏幕1：提问界面 --- */
  .screen1 {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 20px;
    z-index: 10;
    transition: opacity 0.5s ease;
  }
  .screen1.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  h1 {
    font-size: 26px;
    line-height: 1.6;
    color: #1a1a1a;
    margin-bottom: 50px;
    font-weight: 800;
    text-align: center;
    letter-spacing: 1px;
  }

  .btns {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 360px;
  }

  /* 手账风选项按钮 */
  .hand-btn {
    width: 100%;
    padding: 18px 24px;
    border-radius: 28px;
    border: 3px solid #1a1a1a;
    background: #dbeafe;
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
    cursor: pointer;
    position: relative;
    box-shadow: 0 4px 0 #1a1a1a;
    transition: all 0.15s ease;
    letter-spacing: 0.5px;
    line-height: 1.5;
    text-align: center;
  }
  .hand-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #1a1a1a;
  }
  .hand-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #1a1a1a;
  }

  .yes-btn { background: #dbeafe; }
  
  /* 🎯 超级小的“否”按钮 */
  .no-btn {
    background: #fce7f3;
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid #1a1a1a;
    box-shadow: 0 1px 0 #1a1a1a;
    width: auto;
    max-width: fit-content;
    opacity: 0.7;
    letter-spacing: 0px;
    margin-top: 5px;
  }
  .no-btn:active {
    transform: translateY(1px);
    box-shadow: 0 0 0 #1a1a1a;
  }

  /* --- 屏幕2：生日界面 --- */
  .screen2 {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fefdfe;
    background-image:
      linear-gradient(rgba(200, 200, 200, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200, 200, 200, 0.1) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  .screen2.active {
    opacity: 1;
    pointer-events: auto;
  }

  .header-title {
    font-size: 28px;
    font-weight: 800;
    color: #1a1a1a;
    margin-bottom: 40px;
    z-index: 25;
    letter-spacing: 2px;
    text-shadow: 0 4px 10px rgba(248, 176, 199, 0.3);
  }

  /* 满屏飘落的祝福文字 */
  .floating-text {
    position: absolute;
    font-size: 20px;
    font-weight: 800;
    color: #ff7eb3;
    white-space: nowrap;
    pointer-events: none;
    z-index: 30;
    animation: floatUp 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    text-shadow: 0 2px 8px rgba(248, 176, 199, 0.3);
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(var(--rot)) scale(0.8); opacity: 0; }
    10%  { opacity: 1; }
    80%  { opacity: 0.9; }
    100% { transform: translateY(-20vh) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }

  /* 背景光晕 */
  .bg-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.4;
    z-index: 15;
    pointer-events: none;
  }
  .glow1 { width: 250px; height: 250px; background: #ffd1e8; top: 10%; left: 10%; }
  .glow2 { width: 300px; height: 300px; background: #e8d4ff; bottom: 10%; right: 10%; }
  .glow3 { width: 200px; height: 200px; background: #d4e8ff; top: 50%; left: 50%; transform: translate(-50%, -50%); }

  /* 🎬 “是”按钮的丝滑放大过渡层 */
  .zoom-overlay-img {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 200px;
    height: auto;
    z-index: 9999;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(255, 126, 179, 0.8);
    transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    pointer-events: none;
  }
  .zoom-overlay-img.zoom-active {
    transform: translate(-50%, -50%) scale(30);
    opacity: 0; /* 放大到极限时淡出，露出第二页 */
  }

  /* 🦠 “否”按钮的病毒闪烁特效 */
  .virus-img {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    animation: virusBlink 0.15s infinite alternate;
  }
  .virus-text {
    position: fixed;
    z-index: 1001;
    font-weight: 900;
    color: #ff0055;
    text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
    pointer-events: none;
    animation: virusBlink 0.15s infinite alternate;
    white-space: nowrap;
  }
  @keyframes virusBlink {
    0% { opacity: 0.1; transform: scale(0.8) rotate(-10deg); }
    100% { opacity: 1; transform: scale(1.2) rotate(10deg); }
  }
</style>
</head>
<body>

  <!-- 屏幕1：提问 -->
  <div class="screen1" id="screen1">
    <h1>王心淇 是你最最最最最最好的朋友吗？</h1>
    <div class="btns">
      <button class="hand-btn yes-btn" id="yesBtn">A. 是的，绝对是最好的朋友！</button>
      <button class="hand-btn no-btn" id="noBtn">B. 不是…</button>
    </div>
  </div>

  <!-- 屏幕2：生日界面 -->
  <div class="screen2" id="screen2">
    <div class="bg-glow glow1"></div>
    <div class="bg-glow glow2"></div>
    <div class="bg-glow glow3"></div>
    <div class="header-title" id="headerTitle">好了，你可以打开了</div>
  </div>

<script>
  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');

  let floatingInterval = null;

  // --- 点“是”的处理：丝滑放大过渡 ---
  yesBtn.addEventListener('click', () => {
    // 1. 创建一个覆盖全屏的图片元素
    const zoomImg = document.createElement('img');
    zoomImg.src = 'https://s41.ax1x.com/2026/10/12/pnalL8A.md.png';
    zoomImg.className = 'zoom-overlay-img';
    zoomImg.referrerPolicy = 'no-referrer'; // 防止图床防盗链
    document.body.appendChild(zoomImg);

    // 2. 触发 CSS 过渡动画（逐渐放大并淡出）
    requestAnimationFrame(() => {
      zoomImg.classList.add('zoom-active');
    });

    // 3. 等待放大动画进行到一半，开始淡出屏幕1
    setTimeout(() => {
      screen1.classList.add('fade-out');
    }, 600);

    // 4. 动画结束后，切换到屏幕2
    setTimeout(() => {
      screen1.classList.add('hidden');
      screen2.classList.add('active');
      startBirthdayRain();
      zoomImg.remove(); // 清理过渡图片
    }, 1300);
  });

  // --- 点“否”的处理：全屏病毒式闪烁 ---
  noBtn.addEventListener('click', () => {
    // 清理可能残留的病毒元素
    document.querySelectorAll('.virus-img, .virus-text').forEach(el => el.remove());

    const imgSrc = 'https://s41.ax1x.com/2026/10/12/pnalqCd.png';
    const textStr = '我不信';
    const imgCount = 20; // 图片数量
    const textCount = 25; // 文字数量

    // 生成闪烁的图片
    for (let i = 0; i < imgCount; i++) {
      const img = document.createElement('img');
      img.src = imgSrc;
      img.className = 'virus-img';
      img.referrerPolicy = 'no-referrer';
      img.style.left = Math.random() * 85 + 'vw';
      img.style.top = Math.random() * 85 + 'vh';
      img.style.width = (Math.random() * 50 + 30) + 'px'; // 随机大小 30px ~ 80px
      img.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(img);
    }

    // 生成闪烁的文字
    for (let i = 0; i < textCount; i++) {
      const div = document.createElement('div');
      div.className = 'virus-text';
      div.textContent = textStr;
      div.style.left = Math.random() * 80 + 'vw';
      div.style.top = Math.random() * 80 + 'vh';
      div.style.fontSize = (Math.random() * 25 + 15) + 'px'; // 随机字号 15px ~ 40px
      div.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(div);
    }

    // 可选：5秒后自动清理，避免页面太卡（如果想永久保留可以删掉这段）
    setTimeout(() => {
      document.querySelectorAll('.virus-img, .virus-text').forEach(el => el.remove());
    }, 8000);
  });

  // 满屏飘落“崔梦悦，生日快乐！🎂”特效
  function startBirthdayRain() {
    if (floatingInterval) clearInterval(floatingInterval);

    const textStr = '崔梦悦，生日快乐！🎂';
    const colors = ['#ff7eb3', '#f8b0c7', '#b3d4ff', '#d4b3ff', '#ffb3d4'];

    floatingInterval = setInterval(() => {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = textStr;

      const randomLeft = Math.random() * 80 + 'vw';
      const randomDelay = Math.random() * 0.5 + 's';
      const randomScale = Math.random() * 0.6 + 0.7;
      const randomRotate = (Math.random() * 20 - 10) + 'deg';
      const randomColor = colors[Math.floor(Math.random() * colors.length)];

      el.style.left = randomLeft;
      el.style.animationDelay = randomDelay;
      el.style.setProperty('--rot', randomRotate);
      el.style.transform = `scale(${randomScale})`;
      el.style.color = randomColor;
      el.style.textShadow = `0 2px 10px ${randomColor}66`;

      screen2.appendChild(el);

      setTimeout(() => {
        if (el.parentNode) el.remove();
      }, 5000);

    }, 300);
  }
</script>
</body>
</html>
