<!DOCTYPE html>
<html lang="zh-CN">
<!-- 
  署名：X星G辰X
  作品名称：3D粒子蛋糕 · 星辰
  作品介绍：基于Three.js打造的3D粒子特效生日蛋糕，包含动态粒子聚合、流光粒子环、流星特效、Bloom光效等视觉效果，
           点击/触摸触发粒子聚合动画，伴随背景音乐播放，适配移动端与桌面端，打造沉浸式生日祝福体验。
  技术栈：Three.js、WebGL、HTML5、JavaScript
  【新增】点击火焰吹灭蜡烛 → 冒烟浮现“崔梦悦，生日快乐” → 绽放烟花 → 蜡烛重新点亮
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>崔梦悦，生日快乐</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #06060f;
        }
        /* 吹蜡烛提示 */
        #tip {
            position: fixed;
            left: 50%;
            bottom: 8%;
            transform: translateX(-50%);
            color: rgba(255, 224, 240, 0.9);
            font-size: 15px;
            letter-spacing: 2px;
            text-shadow: 0 0 14px rgba(255, 140, 210, 0.9), 0 0 30px rgba(255, 120, 200, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
            white-space: nowrap;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="tip">🕯️ 点击火焰，吹灭蜡烛</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ========== 音乐引擎 ==========
        const MUSIC_IDS = '2008308259';
        let bgMusic = null;
        let currentPlaylist = [];
        let currentIdx = 0;
        let musicInitiated = false;

        function initMusic() {
            const ids = MUSIC_IDS.split(',').map(id => id.trim()).filter(id => /^\d+$/.test(id));
            if (ids.length === 0) return;
            currentPlaylist = [...ids].sort(() => Math.random() - 0.5);
            function playNext() {
                if (!bgMusic) return;
                if (currentIdx >= currentPlaylist.length) {
                    currentPlaylist = [...ids].sort(() => Math.random() - 0.5);
                    currentIdx = 0;
                }
                const id = currentPlaylist[currentIdx++];
                bgMusic.src = `https://music.163.com/song/media/outer/url?id=${id}.mp3`;
                bgMusic.load();
                bgMusic.play().catch(e => console.log("audio play blocked"));
            }
            const firstId = currentPlaylist[currentIdx++];
            bgMusic = new Audio(`https://music.163.com/song/media/outer/url?id=${firstId}.mp3`);
            bgMusic.volume = 0.85;
            bgMusic.loop = false;
            bgMusic.addEventListener('ended', playNext);
            bgMusic.addEventListener('error', () => setTimeout(playNext, 1500));
            bgMusic.play().catch(e => console.log("autoplay blocked, click to start"));
        }
        function resumeMusic() {
            if (!bgMusic && !musicInitiated) {
                initMusic();
                musicInitiated = true;
            } else if (bgMusic && bgMusic.paused) {
                bgMusic.play().catch(e => {});
            }
        }

        // ========== Three.js 核心 ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06060f);
        scene.fog = new THREE.FogExp2(0x06060f, 0.0022);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3.2, 2.4, 5.2);
        camera.lookAt(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // 后期 Bloom 光效
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.25, 0.15);
        bloomPass.threshold = 0.12;
        bloomPass.strength = 0.7;
        bloomPass.radius = 0.4;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);

        // 轨道控制
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 1.2;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.2;
        controls.target.set(0, 1.2, 0);

        // 灯光系统
        const ambientLight = new THREE.AmbientLight(0x111122, 0.08);
        scene.add(ambientLight);
        const backLight = new THREE.PointLight(0xffaa66, 0.15);
        backLight.position.set(1.5, 2.5, 2);
        scene.add(backLight);
        const fillLight = new THREE.PointLight(0x6688ff, 0.1);
        fillLight.position.set(-1, 1.8, 2.5);
        scene.add(fillLight);
        const topHighlight = new THREE.PointLight(0xaaccff, 0.05);
        topHighlight.position.set(0, 2.0, 0.3);
        scene.add(topHighlight);

        // 背景星空粒子
        const starCount = 2000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < starCount; i++) {
            starPos.push((Math.random() - 0.5) * 200);
            starPos.push((Math.random() - 0.5) * 100);
            starPos.push((Math.random() - 0.5) * 80 - 40);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
        const starMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.07, transparent: true, opacity: 0.4 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ========== 外圈流光粒子环 ==========
        const ringParticleCount = 1800;
        const ringGeo = new THREE.BufferGeometry();
        const ringPositions = [];
        const ringColors = [];
        for (let i = 0; i < ringParticleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 1.45 + Math.random() * 0.35;
            const y = -0.1 + Math.random() * 1.9;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            ringPositions.push(x, y, z);
            const hue = (angle + Math.random() * 0.5) % 1.0;
            const rgb = new THREE.Color().setHSL(hue, 0.85, 0.55);
            ringColors.push(rgb.r, rgb.g, rgb.b);
        }
        ringGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ringPositions), 3));
        ringGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(ringColors), 3));
        const ringMat = new THREE.PointsMaterial({
            size: 0.03,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const ringParticles = new THREE.Points(ringGeo, ringMat);
        scene.add(ringParticles);

        // ========== 背景氛围光环 ==========
        const ambientRingGeo = new THREE.TorusGeometry(1.75, 0.015, 16, 120);
        const ambientRingMat = new THREE.MeshBasicMaterial({
            color: 0x335588,
            transparent: true,
            opacity: 0.25,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const ambientRing = new THREE.Mesh(ambientRingGeo, ambientRingMat);
        ambientRing.rotation.x = Math.PI / 2;
        ambientRing.position.y = 0.5;
        scene.add(ambientRing);

        const ambientRing2Geo = new THREE.TorusGeometry(2.0, 0.01, 12, 100);
        const ambientRing2Mat = new THREE.MeshBasicMaterial({
            color: 0x553366,
            transparent: true,
            opacity: 0.2,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const ambientRing2 = new THREE.Mesh(ambientRing2Geo, ambientRing2Mat);
        ambientRing2.rotation.x = Math.PI / 2;
        ambientRing2.rotation.z = 0.3;
        ambientRing2.position.y = 0.3;
        scene.add(ambientRing2);

        // ========== 流星系统 ==========
        const shootingStars = [];
        const STAR_COUNT = 8;
        for (let i = 0; i < STAR_COUNT; i++) {
            const length = 0.15 + Math.random() * 0.25; 
            const pointsCount = 8;
            const positionsArray = new Float32Array(pointsCount * 3);
            const startX = (Math.random() - 0.5) * 10;
            const startY = (Math.random() - 0.5) * 6 + 1;
            const startZ = (Math.random() - 0.5) * 6 - 2;
            const dir = new THREE.Vector3(
                -0.8 + Math.random() * 0.4,
                -0.6 + Math.random() * 0.3,
                -0.3 + Math.random() * 0.2
            ).normalize();
            
            const geometry = new THREE.BufferGeometry();
            const material = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(0.6 + Math.random() * 0.15, 0.7, 0.7),
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.3 + Math.random() * 0.4,
                depthWrite: false
            });
            
            for (let j = 0; j < pointsCount; j++) {
                const t = j / (pointsCount - 1);
                positionsArray[j * 3] = startX + dir.x * t * length;
                positionsArray[j * 3 + 1] = startY + dir.y * t * length;
                positionsArray[j * 3 + 2] = startZ + dir.z * t * length;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positionsArray, 3));
            
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            
            shootingStars.push({
                line,
                dir,
                speed: 0.008 + Math.random() * 0.015,
                length,
                startX, startY, startZ,
                pointsCount,
                positionsArray
            });
        }

        // ========== 粒子系统核心 ==========
        const PARTICLE_COUNT = 9800;
        let particleSystem = null;
        let cakePositions = [];
        let scatterPositions = [];
        let particleActivated = [];
        let particleActivationTime = [];
        let particleSettleDuration = [];

        // ★ 新增：保存粒子原始颜色，供"吹蜡烛"时调暗火焰
        let cakeColorsBase = null;

        function addDiskPoints(count, y, rMin, rMax, biasCenter = 0.3) {
            const pts = [];
            for (let i = 0; i < count; i++) {
                let r;
                if (Math.random() < biasCenter) {
                    r = rMin + Math.random() * (rMax - rMin) * 0.5;
                } else {
                    r = rMin + Math.random() * (rMax - rMin);
                }
                const angle = Math.random() * Math.PI * 2;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                pts.push(new THREE.Vector3(x, y, z));
            }
            return pts;
        }

        function addSolidBase(count, yStart, yEnd, rMin, rMax) {
            const pts = [];
            for (let i = 0; i < count; i++) {
                const y = yStart + Math.random() * (yEnd - yStart);
                let r;
                if (Math.random() < 0.6) {
                    r = rMin + Math.random() * (rMax - rMin);
                } else {
                    r = rMin + Math.pow(Math.random(), 1.2) * (rMax - rMin);
                }
                const angle = Math.random() * Math.PI * 2;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                pts.push(new THREE.Vector3(x, y, z));
            }
            return pts;
        }

        function generateCakePositions() {
            const positions = [];
            const bottomRMin = 0.96, bottomRMax = 1.14;
            const bottomY0 = -0.28, bottomY1 = 0.18;
            const midRMin = 0.73, midRMax = 0.86;
            const midY0 = 0.20, midY1 = 0.60;
            const topRMin = 0.52, topRMax = 0.65;
            const topY0 = 0.62, topY1 = 0.96;
            const candleR = 0.11;
            const candleY0 = 0.98, candleY1 = 1.50;
            const flameYCenter = 1.54;

            function addCylinderPoints(count, yMin, yMax, rMin, rMax, surfaceBias = 0.65) {
                const pts = [];
                for (let i = 0; i < count; i++) {
                    let r;
                    if (Math.random() < surfaceBias) {
                        r = rMin + Math.random() * (rMax - rMin);
                    } else {
                        r = rMin + Math.pow(Math.random(), 1.5) * (rMax - rMin);
                    }
                    const angle = Math.random() * Math.PI * 2;
                    const y = yMin + Math.random() * (yMax - yMin);
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    pts.push(new THREE.Vector3(x, y, z));
                }
                return pts;
            }

            const bottomCnt = Math.floor(PARTICLE_COUNT * 0.18);
            const midCnt = Math.floor(PARTICLE_COUNT * 0.14);
            const topCnt = Math.floor(PARTICLE_COUNT * 0.10);
            const candleCnt = Math.floor(PARTICLE_COUNT * 0.08);
            const solidBaseCnt = 480;
            const bottomDiskCnt = 300;
            const bottomTopDiskCnt = 280;
            const midTopDiskCnt = 240;
            const topTopDiskCnt = 220;
            const candleTopDiskCnt = 90;
            let decorCnt = PARTICLE_COUNT - bottomCnt - midCnt - topCnt - candleCnt - solidBaseCnt -
                bottomDiskCnt - bottomTopDiskCnt - midTopDiskCnt - topTopDiskCnt - candleTopDiskCnt;
            if (decorCnt < 0) decorCnt = 280;

            const bottomPts = addCylinderPoints(bottomCnt, bottomY0, bottomY1, bottomRMin, bottomRMax, 0.65);
            const midPts = addCylinderPoints(midCnt, midY0, midY1, midRMin, midRMax, 0.65);
            const topPts = addCylinderPoints(topCnt, topY0, topY1, topRMin, topRMax, 0.7);
            const candlePts = [];
            for (let i = 0; i < candleCnt; i++) {
                const r = candleR * Math.sqrt(Math.random());
                const angle = Math.random() * Math.PI * 2;
                const y = candleY0 + Math.random() * (candleY1 - candleY0);
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                candlePts.push(new THREE.Vector3(x, y, z));
            }
            const solidBase = addSolidBase(solidBaseCnt, -0.45, -0.26, bottomRMin - 0.05, bottomRMax + 0.03);
            const bottomDisk = addDiskPoints(bottomDiskCnt, bottomY0 - 0.02, bottomRMin, bottomRMax, 0.4);
            const bottomTopDisk = addDiskPoints(bottomTopDiskCnt, bottomY1, bottomRMin, bottomRMax, 0.5);
            const midTopDisk = addDiskPoints(midTopDiskCnt, midY1, midRMin, midRMax, 0.5);
            const topTopDisk = addDiskPoints(topTopDiskCnt, topY1, topRMin, topRMax, 0.5);
            const candleTopDisk = addDiskPoints(candleTopDiskCnt, candleY1, 0, candleR, 0.6);
            const decorPts = [];
            const edgeSteps = Math.floor(decorCnt * 0.45);
            for (let i = 0; i < edgeSteps; i++) {
                const angle = Math.random() * Math.PI * 2;
                let r, y;
                const layer = Math.random();
                if (layer < 0.4) {
                    r = bottomRMax + 0.05;
                    y = bottomY1 + Math.sin(angle * 6) * 0.045;
                } else if (layer < 0.7) {
                    r = midRMax + 0.05;
                    y = midY1 + Math.sin(angle * 7) * 0.04;
                } else {
                    r = topRMax + 0.05;
                    y = topY1 + Math.sin(angle * 8) * 0.04;
                }
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                decorPts.push(new THREE.Vector3(x, y, z));
            }
            const flameCnt = 240;
            for (let i = 0; i < flameCnt; i++) {
                const angle = Math.random() * Math.PI * 2;
                const rad = 0.11 * Math.random();
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                const y = flameYCenter + Math.random() * 0.24;
                decorPts.push(new THREE.Vector3(x, y, z));
            }
            while (decorPts.length < decorCnt) {
                const angle = Math.random() * Math.PI * 2;
                const rad = 0.65 + Math.random() * 0.7;
                const y = 0.15 + Math.random() * 1.45;
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                decorPts.push(new THREE.Vector3(x, y, z));
            }
            const all = [
                ...bottomPts, ...midPts, ...topPts, ...candlePts,
                ...solidBase, ...bottomDisk, ...bottomTopDisk, ...midTopDisk, ...topTopDisk, ...candleTopDisk,
                ...decorPts
            ];
            while (all.length < PARTICLE_COUNT) all.push(new THREE.Vector3(0, 0.8, 0));
            const final = all.slice(0, PARTICLE_COUNT);
            return final.map(v => [v.x, v.y, v.z]);
        }

        function generateScatterPositions() {
            const scatters = [];
            const centerY = 0.6;
            const spiralArmCount = 4;
            const spiralTotalParticles = Math.floor(PARTICLE_COUNT * 0.32);
            const particlesPerArm = Math.floor(spiralTotalParticles / spiralArmCount);
            const sphereParticleCount = PARTICLE_COUNT - (particlesPerArm * spiralArmCount);

            for (let arm = 0; arm < spiralArmCount; arm++) {
                const baseAngle = (arm / spiralArmCount) * Math.PI * 2;
                for (let i = 0; i < particlesPerArm; i++) {
                    const t = i / particlesPerArm;
                    const angle = baseAngle + t * 3.2 * Math.PI;
                    const r = 1.3 + t * 3.2;
                    const y = centerY + (t - 0.45) * 3.8;
                    const x = Math.cos(angle) * r + (Math.random() - 0.5) * 0.5;
                    const z = Math.sin(angle) * r + (Math.random() - 0.5) * 0.5;
                    scatters.push([x, y + (Math.random() - 0.5) * 0.35, z]);
                }
            }
            for (let i = 0; i < sphereParticleCount; i++) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = Math.random() * Math.PI * 2;
                const r = 1.8 + Math.pow(Math.random(), 0.55) * 3.5;
                const x = Math.sin(phi) * Math.cos(theta) * r;
                const y = centerY + Math.sin(phi) * Math.sin(theta) * r;
                const z = Math.cos(phi) * r;
                scatters.push([x, y, z]);
            }
            while (scatters.length < PARTICLE_COUNT) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = Math.random() * Math.PI * 2;
                const r = 2 + Math.random() * 3;
                scatters.push([
                    Math.sin(phi) * Math.cos(theta) * r,
                    centerY + Math.sin(phi) * Math.sin(theta) * r,
                    Math.cos(phi) * r
                ]);
            }
            return scatters.slice(0, PARTICLE_COUNT);
        }

        function generateCakeColors(positions) {
            const colors = [];
            for (let i = 0; i < positions.length; i++) {
                const y = positions[i][1];
                const xAbs = Math.abs(positions[i][0]);
                let r, g, b;
                if (y < -0.3) {
                    r = 0.6 + Math.random() * 0.2; g = 0.38 + Math.random() * 0.2; b = 0.22 + Math.random() * 0.2;
                } else if (y < -0.2) {
                    r = 0.7 + Math.random() * 0.2; g = 0.45 + Math.random() * 0.22; b = 0.28 + Math.random() * 0.2;
                } else if (y < 0.2) {
                    r = 0.8 + Math.random() * 0.15; g = 0.5 + Math.random() * 0.22; b = 0.32 + Math.random() * 0.18;
                } else if (y < 0.65) {
                    r = 0.9 + Math.random() * 0.1; g = 0.65 + Math.random() * 0.18; b = 0.42 + Math.random() * 0.18;
                } else if (y < 1.0) {
                    r = 0.95; g = 0.75 + Math.random() * 0.15; b = 0.5 + Math.random() * 0.2;
                } else {
                    r = 0.95; g = 0.65 + Math.random() * 0.25; b = 0.38 + Math.random() * 0.25;
                }
                if (y > 1.52 && xAbs < 0.28) {
                    r = 1.0; g = 0.45 + Math.random() * 0.45; b = 0.18;
                }
                if (y > 1.48 && y < 1.52 && xAbs < 0.12) {
                    r = 1.0; g = 0.88; b = 0.6;
                }
                colors.push(r, g, b);
            }
            return colors;
        }

        function elasticEaseOut(t) {
            if (t <= 0) return 0;
            if (t >= 1) return 1;
            const c4 = (2 * Math.PI) / 3;
            return Math.pow(2, -10 * t) * Math.sin((t - 0.075) * c4) + 1;
        }

        function getScanRingRadius(y) {
            if (y < 0.18) return 1.16;
            if (y < 0.20) return 1.16 + (0.88 - 1.16) * ((y - 0.18) / 0.02);
            if (y < 0.60) return 0.88;
            if (y < 0.62) return 0.88 + (0.67 - 0.88) * ((y - 0.60) / 0.02);
            if (y < 0.96) return 0.67;
            if (y < 0.98) return 0.67 + (0.13 - 0.67) * ((y - 0.96) / 0.02);
            if (y < 1.50) return 0.13;
            return 0.07;
        }

        function initParticleSystem() {
            cakePositions = generateCakePositions();
            scatterPositions = generateScatterPositions();
            const initColors = generateCakeColors(cakePositions);

            const initPosArray = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                initPosArray[i * 3] = scatterPositions[i][0];
                initPosArray[i * 3 + 1] = scatterPositions[i][1];
                initPosArray[i * 3 + 2] = scatterPositions[i][2];
            }

            particleActivated = new Array(PARTICLE_COUNT).fill(false);
            particleActivationTime = new Array(PARTICLE_COUNT).fill(0);
            particleSettleDuration = new Array(PARTICLE_COUNT).fill(0);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particleSettleDuration[i] = 1.8 + Math.random() * 2.0;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(initPosArray, 3));
            // ★ 颜色单独建数组，并备份一份原始色，供吹蜡烛时调暗火焰
            const colorArray = new Float32Array(initColors);
            geometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
            cakeColorsBase = colorArray.slice();

            const particleMat = new THREE.PointsMaterial({
                size: 0.038,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            });
            particleSystem = new THREE.Points(geometry, particleMat);
            scene.add(particleSystem);
        }

        let scanRingMain = null;
        let scanRingSecondary = null;
        let scanRingMainMat = null;
        let scanRingSecondaryMat = null;

        function createScanRings() {
            const torusGeoMain = new THREE.TorusGeometry(1, 0.025, 20, 120);
            scanRingMainMat = new THREE.MeshBasicMaterial({
                color: 0x22ccff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            scanRingMain = new THREE.Mesh(torusGeoMain, scanRingMainMat);
            scanRingMain.rotation.x = Math.PI / 2;
            scanRingMain.visible = false;
            scene.add(scanRingMain);

            const torusGeoSecondary = new THREE.TorusGeometry(1, 0.018, 16, 100);
            scanRingSecondaryMat = new THREE.MeshBasicMaterial({
                color: 0x9966ff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            scanRingSecondary = new THREE.Mesh(torusGeoSecondary, scanRingSecondaryMat);
            scanRingSecondary.rotation.x = Math.PI / 2;
            scanRingSecondary.visible = false;
            scene.add(scanRingSecondary);
        }

        const ANIM_PHASE = { PRE: 'pre', SCANNING: 'scanning', SETTLING: 'settling', DONE: 'done' };
        let animPhase = ANIM_PHASE.PRE;
        let animStartTime = null;
        let animationStarted = false;
        const SCAN_START_DELAY = 1.8;
        const SCAN_Y_START = -0.65;
        const SCAN_Y_END = 1.72;
        const SCAN_DURATION = 11.8;
        const SCAN_FADE_DURATION = 0.9;
        let scanProgress = 0;
        let scanRingFadeOutStart = false;
        let scanRingFadeOutTime = 0;

        let particleSortedIndices = [];

        function preSortParticles() {
            const indexed = cakePositions.map((pos, i) => ({ idx: i, y: pos[1] }));
            indexed.sort((a, b) => a.y - b.y);
            particleSortedIndices = indexed.map(item => item.idx);
        }

        let lastActivatedSortedIndex = -1;

        function batchActivateParticles(scanY) {
            const activateThreshold = scanY + 0.06;
            while (lastActivatedSortedIndex + 1 < particleSortedIndices.length) {
                const nextIdx = particleSortedIndices[lastActivatedSortedIndex + 1];
                const targetY = cakePositions[nextIdx][1];
                if (targetY <= activateThreshold) {
                    lastActivatedSortedIndex++;
                    if (!particleActivated[nextIdx]) {
                        particleActivated[nextIdx] = true;
                        particleActivationTime[nextIdx] = (performance.now() - animStartTime) / 1000;
                    }
                } else {
                    break;
                }
            }
        }

        function updateParticlePositions(currentTimeSec) {
            if (!particleSystem) return;
            const posArray = particleSystem.geometry.attributes.position.array;
            let anyUpdated = false;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (!particleActivated[i]) continue;
                const elapsed = currentTimeSec - particleActivationTime[i];
                const duration = particleSettleDuration[i];
                if (elapsed >= duration) {
                    if (posArray[i * 3] !== cakePositions[i][0] ||
                        posArray[i * 3 + 1] !== cakePositions[i][1] ||
                        posArray[i * 3 + 2] !== cakePositions[i][2]) {
                        posArray[i * 3] = cakePositions[i][0];
                        posArray[i * 3 + 1] = cakePositions[i][1];
                        posArray[i * 3 + 2] = cakePositions[i][2];
                        anyUpdated = true;
                    }
                    continue;
                }
                const t = elapsed / duration;
                const factor = elasticEaseOut(t);
                const sx = scatterPositions[i][0];
                const sy = scatterPositions[i][1];
                const sz = scatterPositions[i][2];
                const tx = cakePositions[i][0];
                const ty = cakePositions[i][1];
                const tz = cakePositions[i][2];
                posArray[i * 3] = sx + (tx - sx) * factor;
                posArray[i * 3 + 1] = sy + (ty - sy) * factor;
                posArray[i * 3 + 2] = sz + (tz - sz) * factor;
                anyUpdated = true;
            }

            if (anyUpdated) {
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }
        }

        function allParticlesSettled(currentTimeSec) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (!particleActivated[i]) return false;
                if ((currentTimeSec - particleActivationTime[i]) < particleSettleDuration[i]) return false;
            }
            return true;
        }

        let bgTime = 0;
        function animateBackground() {
            bgTime += 0.012;
            stars.rotation.y = bgTime * 0.03;
            stars.rotation.x = Math.sin(bgTime * 0.1) * 0.05;
            ringParticles.rotation.y += 0.003;
            ringParticles.rotation.x = Math.sin(bgTime * 0.5) * 0.1;
            ambientRing.rotation.z += 0.002;
            ambientRing2.rotation.z -= 0.0015;

            // 更新流星位置
            shootingStars.forEach(star => {
                const { line, dir, speed, length, pointsCount, positionsArray } = star;
                const currentHead = new THREE.Vector3(
                    positionsArray[(pointsCount-1)*3],
                    positionsArray[(pointsCount-1)*3+1],
                    positionsArray[(pointsCount-1)*3+2]
                );
                currentHead.add(dir.clone().multiplyScalar(speed));
                
                // 超出边界则重置
                if (currentHead.x < -6 || currentHead.x > 6 || currentHead.y < -4 || currentHead.y > 6 || currentHead.z < -6 || currentHead.z > 4) {
                    const newStartX = (Math.random() - 0.5) * 10;
                    const newStartY = (Math.random() - 0.5) * 6 + 1;
                    const newStartZ = (Math.random() - 0.5) * 6 - 2;
                    const newDir = new THREE.Vector3(
                        -0.8 + Math.random() * 0.4,
                        -0.6 + Math.random() * 0.3,
                        -0.3 + Math.random() * 0.2
                    ).normalize();
                    star.dir.copy(newDir);
                    for (let j = 0; j < pointsCount; j++) {
                        const t = j / (pointsCount - 1);
                        positionsArray[j * 3] = newStartX + newDir.x * t * length;
                        positionsArray[j * 3 + 1] = newStartY + newDir.y * t * length;
                        positionsArray[j * 3 + 2] = newStartZ + newDir.z * t * length;
                    }
                } else {
                    for (let j = 0; j < pointsCount; j++) {
                        const t = j / (pointsCount - 1);
                        positionsArray[j * 3] = currentHead.x - dir.x * (1 - t) * length;
                        positionsArray[j * 3 + 1] = currentHead.y - dir.y * (1 - t) * length;
                        positionsArray[j * 3 + 2] = currentHead.z - dir.z * (1 - t) * length;
                    }
                }
                line.geometry.attributes.position.needsUpdate = true;
            });
        }

        function startAnimation() {
            if (animationStarted) return;
            animationStarted = true;
            animStartTime = performance.now();
            resumeMusic();
            lastActivatedSortedIndex = -1;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particleActivated[i] = false;
                particleActivationTime[i] = 0;
            }
            animPhase = ANIM_PHASE.PRE;
            scanRingMain.visible = false;
            scanRingSecondary.visible = false;
            ambientLight.intensity = 0.08;
            backLight.intensity = 0.15;
            fillLight.intensity = 0.1;
            topHighlight.intensity = 0.05;
            bloomPass.strength = 0.7;
            controls.autoRotate = false;
        }

        // 用户交互触发
        window.addEventListener('click', startAnimation);
        window.addEventListener('touchstart', startAnimation);

        initParticleSystem();
        preSortParticles();
        createScanRings();

        /* ==================================================================
           ★★★ 新增模块：吹蜡烛 · 冒烟文字 · 烟花 · 重新点亮 ★★★
           ================================================================== */

        const BIRTHDAY_TEXT = '崔梦悦，生日快乐';
        const tipEl = document.getElementById('tip');

        // ---------- 火焰粒子索引（用于调暗/点亮） ----------
        const flameIndices = [];     // 火焰粒子的下标
        const flameDrift = [];       // 每个火焰粒子被"吹散"时的漂移方向（扁平数组 xyz）
        let flameFade = 1;           // 1 = 燃烧中，0 = 完全熄灭
        let lastFlameFade = 1;

        function buildFlameData() {
            flameIndices.length = 0;
            flameDrift.length = 0;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const r = cakeColorsBase[i * 3];
                const b = cakeColorsBase[i * 3 + 2];
                // 火焰色特征：R 接近 1.0，B 固定 0.18，且高度在蜡烛顶端之上
                if (r > 0.99 && b < 0.3 && cakePositions[i][1] > 1.5) {
                    flameIndices.push(i);
                    const dx = cakePositions[i][0];
                    const dz = cakePositions[i][2];
                    const len = Math.hypot(dx, dz) || 1;
                    // 向外 + 向上漂散
                    flameDrift.push(
                        (dx / len) * (0.05 + Math.random() * 0.12) + (Math.random() - 0.5) * 0.12,
                        0.10 + Math.random() * 0.28,
                        (dz / len) * (0.05 + Math.random() * 0.12) + (Math.random() - 0.5) * 0.12
                    );
                }
            }
        }

        // 根据 flameFade 更新火焰粒子的颜色（调暗）与位置（吹散）
        function applyFlameState() {
            if (flameFade === 1 && lastFlameFade === 1) return; // 完全点燃且无变化，跳过
            lastFlameFade = flameFade;

            const posAttr = particleSystem.geometry.attributes.position;
            const colAttr = particleSystem.geometry.attributes.color;
            const pa = posAttr.array;
            const ca = colAttr.array;
            const inv = 1 - flameFade;

            for (let k = 0; k < flameIndices.length; k++) {
                const i = flameIndices[k];
                pa[i * 3]     = cakePositions[i][0] + flameDrift[k * 3]     * inv;
                pa[i * 3 + 1] = cakePositions[i][1] + flameDrift[k * 3 + 1] * inv;
                pa[i * 3 + 2] = cakePositions[i][2] + flameDrift[k * 3 + 2] * inv;
                ca[i * 3]     = cakeColorsBase[i * 3]     * flameFade;
                ca[i * 3 + 1] = cakeColorsBase[i * 3 + 1] * flameFade;
                ca[i * 3 + 2] = cakeColorsBase[i * 3 + 2] * flameFade;
            }
            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;
        }

        // ---------- 烟雾粒子系统 ----------
        const SMOKE_MAX = 360;
        const smokePos = new Float32Array(SMOKE_MAX * 3);
        const smokeCol = new Float32Array(SMOKE_MAX * 3);
        const smokeVel = new Float32Array(SMOKE_MAX * 3);
        const smokeBaseCol = new Float32Array(SMOKE_MAX * 3);
        const smokeLife = new Float32Array(SMOKE_MAX);
        const smokeMaxLife = new Float32Array(SMOKE_MAX);
        let smokeCursor = 0;

        const smokeGeo = new THREE.BufferGeometry();
        smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
        smokeGeo.setAttribute('color', new THREE.BufferAttribute(smokeCol, 3));
        const smokeMat = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const smokePoints = new THREE.Points(smokeGeo, smokeMat);
        scene.add(smokePoints);
        // 初始位置挪远，避免出现在原点
        for (let i = 0; i < SMOKE_MAX; i++) smokePos[i * 3 + 1] = -999;

        function spawnSmokeParticle() {
            const i = smokeCursor;
            smokeCursor = (smokeCursor + 1) % SMOKE_MAX;

            const ang = Math.random() * Math.PI * 2;
            const rad = Math.random() * 0.07;
            smokePos[i * 3]     = Math.cos(ang) * rad;
            smokePos[i * 3 + 1] = 1.48 + Math.random() * 0.10;
            smokePos[i * 3 + 2] = Math.sin(ang) * rad;

            smokeVel[i * 3]     = (Math.random() - 0.5) * 0.28;
            smokeVel[i * 3 + 1] = 0.42 + Math.random() * 0.55;
            smokeVel[i * 3 + 2] = (Math.random() - 0.5) * 0.28;

            smokeLife[i] = smokeMaxLife[i] = 2.0 + Math.random() * 1.5;

            const c = 0.35 + Math.random() * 0.25; // 灰白，别太亮否则 Bloom 会过曝
            smokeBaseCol[i * 3]     = c * 0.85;
            smokeBaseCol[i * 3 + 1] = c * 0.92;
            smokeBaseCol[i * 3 + 2] = c * 1.0;
        }

        function updateSmoke(dt) {
            let active = false;
            for (let i = 0; i < SMOKE_MAX; i++) {
                if (smokeLife[i] <= 0) continue;
                active = true;
                smokeLife[i] -= dt;
                if (smokeLife[i] <= 0) {
                    smokeCol[i * 3] = smokeCol[i * 3 + 1] = smokeCol[i * 3 + 2] = 0;
                    continue;
                }
                const damp = Math.max(0, 1 - 0.55 * dt);
                smokeVel[i * 3] *= damp;
                smokeVel[i * 3 + 2] *= damp;
                smokePos[i * 3]     += smokeVel[i * 3]     * dt;
                smokePos[i * 3 + 1] += smokeVel[i * 3 + 1] * dt;
                smokePos[i * 3 + 2] += smokeVel[i * 3 + 2] * dt;

                const k = smokeLife[i] / smokeMaxLife[i];
                const a = Math.pow(k, 0.75);
                smokeCol[i * 3]     = smokeBaseCol[i * 3]     * a;
                smokeCol[i * 3 + 1] = smokeBaseCol[i * 3 + 1] * a;
                smokeCol[i * 3 + 2] = smokeBaseCol[i * 3 + 2] * a;
            }
            if (active) {
                smokeGeo.attributes.position.needsUpdate = true;
                smokeGeo.attributes.color.needsUpdate = true;
            }
        }

        // ---------- 烟花粒子系统 ----------
        const FW_MAX = 3000;
        const fwPos = new Float32Array(FW_MAX * 3);
        const fwCol = new Float32Array(FW_MAX * 3);
        const fwVel = new Float32Array(FW_MAX * 3);
        const fwBaseCol = new Float32Array(FW_MAX * 3);
        const fwLife = new Float32Array(FW_MAX);
        const fwMaxLife = new Float32Array(FW_MAX);
        let fwCursor = 0;

        const fwGeo = new THREE.BufferGeometry();
        fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPos, 3));
        fwGeo.setAttribute('color', new THREE.BufferAttribute(fwCol, 3));
        const fwMat = new THREE.PointsMaterial({
            size: 0.07,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const fwPoints = new THREE.Points(fwGeo, fwMat);
        scene.add(fwPoints);
        for (let i = 0; i < FW_MAX; i++) fwPos[i * 3 + 1] = -999;

        const fwColorTmp = new THREE.Color();

        function launchFirework() {
            const cx = (Math.random() - 0.5) * 7;
            const cy = 2.1 + Math.random() * 2.0;
            const cz = -2.0 + Math.random() * 3.0;
            const hue = Math.random();
            const count = 140 + Math.floor(Math.random() * 70);

            for (let n = 0; n < count; n++) {
                const i = fwCursor;
                fwCursor = (fwCursor + 1) % FW_MAX;

                // 球面均匀随机方向
                const u = Math.random() * 2 - 1;
                const theta = Math.random() * Math.PI * 2;
                const s = Math.sqrt(1 - u * u);
                const sp = 2.2 + Math.random() * 3.4;

                fwVel[i * 3]     = s * Math.cos(theta) * sp;
                fwVel[i * 3 + 1] = u * sp;
                fwVel[i * 3 + 2] = s * Math.sin(theta) * sp;

                fwPos[i * 3]     = cx;
                fwPos[i * 3 + 1] = cy;
                fwPos[i * 3 + 2] = cz;

                fwColorTmp.setHSL((hue + Math.random() * 0.08) % 1, 0.92, 0.62);
                fwBaseCol[i * 3]     = fwColorTmp.r;
                fwBaseCol[i * 3 + 1] = fwColorTmp.g;
                fwBaseCol[i * 3 + 2] = fwColorTmp.b;

                fwLife[i] = fwMaxLife[i] = 1.3 + Math.random() * 0.9;
            }
        }

        function updateFireworks(dt) {
            let active = false;
            for (let i = 0; i < FW_MAX; i++) {
                if (fwLife[i] <= 0) continue;
                active = true;
                fwLife[i] -= dt;
                if (fwLife[i] <= 0) {
                    fwCol[i * 3] = fwCol[i * 3 + 1] = fwCol[i * 3 + 2] = 0;
                    continue;
                }
                const drag = Math.max(0, 1 - 1.4 * dt);
                fwVel[i * 3]     *= drag;
                fwVel[i * 3 + 1] = fwVel[i * 3 + 1] * drag - 3.0 * dt; // 重力
                fwVel[i * 3 + 2] *= drag;

                fwPos[i * 3]     += fwVel[i * 3]     * dt;
                fwPos[i * 3 + 1] += fwVel[i * 3 + 1] * dt;
                fwPos[i * 3 + 2] += fwVel[i * 3 + 2] * dt;

                const k = fwLife[i] / fwMaxLife[i];
                const a = k * k; // 尾部快速衰减
                fwCol[i * 3]     = fwBaseCol[i * 3]     * a;
                fwCol[i * 3 + 1] = fwBaseCol[i * 3 + 1] * a;
                fwCol[i * 3 + 2] = fwBaseCol[i * 3 + 2] * a;
            }
            if (active) {
                fwGeo.attributes.position.needsUpdate = true;
                fwGeo.attributes.color.needsUpdate = true;
            }
        }

        // ---------- 文字精灵（“崔梦悦，生日快乐”） ----------
        let textSprite = null;

        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 104px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif';

            // 渐变字色：暖橙 → 粉 → 淡蓝 → 金
            const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
            grad.addColorStop(0.00, '#ffe3b0');
            grad.addColorStop(0.30, '#ff9ad5');
            grad.addColorStop(0.62, '#a8d0ff');
            grad.addColorStop(1.00, '#ffe9a8');

            // 外发光
            ctx.shadowColor = 'rgba(255, 170, 220, 0.95)';
            ctx.shadowBlur = 42;
            ctx.fillStyle = grad;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            // 再描一遍加强亮芯
            ctx.shadowBlur = 16;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.needsUpdate = true;

            const mat = new THREE.SpriteMaterial({
                map: tex,
                transparent: true,
                opacity: 0,
                depthTest: false,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(3.2, 0.8, 1);
            sprite.position.set(0, 1.7, 0);
            sprite.visible = false;
            sprite.renderOrder = 20;
            return sprite;
        }

        // ---------- 演出时间线 ----------
        let showStart = -1;   // -1 表示没有演出进行中
        let smokeAccum = 0;
        let fwTimer = 0;

        const flameAnchor = new THREE.Vector3(0, 1.62, 0); // 火焰世界坐标（用于点击判定）
        const projTmp = new THREE.Vector3();

        function isClickOnFlame(clientX, clientY) {
            projTmp.copy(flameAnchor).project(camera);
            if (projTmp.z > 1) return false; // 在相机背后
            const sx = (projTmp.x * 0.5 + 0.5) * window.innerWidth;
            const sy = (-projTmp.y * 0.5 + 0.5) * window.innerHeight;
            // 命中半径：屏幕短边的 13%，至少 56px，对手机友好
            const r = Math.max(56, Math.min(window.innerWidth, window.innerHeight) * 0.13);
            const dx = clientX - sx;
            const dy = clientY - sy;
            return dx * dx + dy * dy <= r * r;
        }

        function startCandleShow(now) {
            showStart = now;
            smokeAccum = 0;
            fwTimer = 0;
            if (tipEl) tipEl.style.opacity = '0';
        }

        function updateCandleShow(now, dt) {
            if (showStart < 0) return;
            const t = (now - showStart) / 1000;

            // ---- 火焰：吹灭 0.75s / 熄灭保持 / 重新点燃 0.9s ----
            let fade;
            if (t < 0.75) {
                fade = 1 - t / 0.75;
            } else if (t < 6.2) {
                fade = 0;
            } else if (t < 7.1) {
                fade = (t - 6.2) / 0.9;
            } else {
                fade = 1;
            }
            flameFade = Math.max(0, Math.min(1, fade));

            // ---- 冒烟：0.3s ~ 2.8s 持续吐烟 ----
            if (t > 0.3 && t < 2.8) {
                smokeAccum += dt * 48;
                while (smokeAccum >= 1) {
                    spawnSmokeParticle();
                    smokeAccum -= 1;
                }
            }

            // ---- 文字：0.9s 浮现 → 5.7s 淡出 ----
            if (textSprite) {
                let appear = 0;
                if (t > 0.9) appear = Math.min((t - 0.9) / 1.6, 1);
                let disappear = 0;
                if (t > 5.7) disappear = Math.min((t - 5.7) / 0.9, 1);

                const op = appear * (1 - disappear);
                textSprite.material.opacity = op;
                textSprite.visible = op > 0.01;
                // 缓慢上升
                textSprite.position.y = 1.55 + appear * 1.0 - disappear * 0.25;
                const s = 0.72 + appear * 0.28;
                textSprite.scale.set(3.2 * s, 0.8 * s, 1);
            }

            // ---- 烟花：2.3s ~ 6.2s，每隔一小段放一发 ----
            if (t > 2.3 && t < 6.2) {
                fwTimer -= dt;
                if (fwTimer <= 0) {
                    launchFirework();
                    fwTimer = 0.40 + Math.random() * 0.28;
                }
            }

            // ---- 演出结束 ----
            if (t > 7.3) {
                showStart = -1;
                flameFade = 1;
                if (textSprite) {
                    textSprite.material.opacity = 0;
                    textSprite.visible = false;
                }
                if (tipEl) tipEl.style.opacity = '1'; // 可以再吹一次
            }
        }

        function updateCandleSystem(now, dt) {
            updateCandleShow(now, dt);
            applyFlameState();
            updateSmoke(dt);
            updateFireworks(dt);
        }

        function initBirthdayFeature() {
            buildFlameData();
            textSprite = createTextSprite(BIRTHDAY_TEXT);
            scene.add(textSprite);
        }

        // ---------- 点击火焰的交互（区分"点击"和"拖动旋转"） ----------
        let pointerDownPos = null;
        window.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('pointerup', (e) => {
            if (!pointerDownPos) return;
            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            pointerDownPos = null;
            if (dx * dx + dy * dy > 144) return; // 移动超过 12px 视为拖动

            if (!animationStarted) return;                 // 首次点击交给 startAnimation
            if (animPhase !== ANIM_PHASE.DONE) return;     // 蛋糕还没聚合完成
            if (showStart >= 0) return;                    // 演出进行中，忽略
            if (isClickOnFlame(e.clientX, e.clientY)) {
                startCandleShow(performance.now());
            }
        });

        initBirthdayFeature();

        /* ==================================================================
           主渲染循环
           ================================================================== */

        let lastTimestamp = 0;

        function renderLoop(timestamp) {
            requestAnimationFrame(renderLoop);

            // 统一计算帧间隔（秒），最大 0.05 防止切后台后跳变
            const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, 0.05) : 0.016;
            lastTimestamp = timestamp;

            if (!animationStarted) {
                animateBackground();
                effectComposer.render();
                return;
            }

            const currentTimeSec = (timestamp - animStartTime) / 1000;

            if (animPhase === ANIM_PHASE.PRE) {
                const preProgress = Math.min(currentTimeSec / SCAN_START_DELAY, 1.0);
                const easeIn = 1 - Math.pow(1 - preProgress, 3);

                ambientLight.intensity = 0.08 + (0.5 - 0.08) * easeIn;
                backLight.intensity = 0.15 + (0.5 - 0.15) * easeIn;
                fillLight.intensity = 0.1 + (0.35 - 0.1) * easeIn;
                topHighlight.intensity = 0.05 + (0.25 - 0.05) * easeIn;

                if (preProgress > 0.4) {
                    const ringFadeIn = (preProgress - 0.4) / 0.6;
                    scanRingMain.visible = true;
                    scanRingSecondary.visible = true;
                    scanRingMainMat.opacity = 0.85 * ringFadeIn;
                    scanRingSecondaryMat.opacity = 0.55 * ringFadeIn;
                    scanRingMain.position.y = SCAN_Y_START;
                    scanRingSecondary.position.y = SCAN_Y_START - 0.06;
                }

                if (particleSystem) particleSystem.rotation.y += 0.0015;

                if (currentTimeSec >= SCAN_START_DELAY) {
                    animPhase = ANIM_PHASE.SCANNING;
                    scanRingMain.position.y = SCAN_Y_START;
                    scanRingSecondary.position.y = SCAN_Y_START - 0.06;
                    scanRingMain.visible = true;
                    scanRingSecondary.visible = true;
                    scanRingMainMat.opacity = 0.85;
                    scanRingSecondaryMat.opacity = 0.55;
                    lastActivatedSortedIndex = -1;
                    batchActivateParticles(SCAN_Y_START);
                }
            } else if (animPhase === ANIM_PHASE.SCANNING) {
                const scanElapsed = currentTimeSec - SCAN_START_DELAY;
                scanProgress = Math.min(scanElapsed / SCAN_DURATION, 1.0);

                const scanY = SCAN_Y_START + scanProgress * (SCAN_Y_END - SCAN_Y_START);
                scanRingMain.position.y = scanY;
                scanRingSecondary.position.y = scanY - 0.07 - scanProgress * 0.04;

                const mainRadius = getScanRingRadius(scanY);
                const secondaryRadius = mainRadius * 1.06;
                scanRingMain.scale.set(mainRadius, mainRadius, mainRadius);
                scanRingSecondary.scale.set(secondaryRadius, secondaryRadius, secondaryRadius);

                batchActivateParticles(scanY);
                updateParticlePositions(currentTimeSec);

                if (particleSystem) particleSystem.rotation.y += 0.0012;

                if (scanProgress >= 1.0) {
                    animPhase = ANIM_PHASE.SETTLING;
                    scanRingFadeOutStart = true;
                    scanRingFadeOutTime = currentTimeSec;
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        if (!particleActivated[i]) {
                            particleActivated[i] = true;
                            particleActivationTime[i] = currentTimeSec;
                        }
                    }
                }
            } else if (animPhase === ANIM_PHASE.SETTLING) {
                const fadeElapsed = currentTimeSec - scanRingFadeOutTime;
                const fadeProgress = Math.min(fadeElapsed / SCAN_FADE_DURATION, 1.0);

                if (scanRingFadeOutStart) {
                    scanRingMainMat.opacity = 0.85 * (1 - fadeProgress);
                    scanRingSecondaryMat.opacity = 0.55 * (1 - fadeProgress);
                    const expandScale = 1 + fadeProgress * 2.5;
                    const baseMR = getScanRingRadius(SCAN_Y_END);
                    const baseSR = baseMR * 1.06;
                    scanRingMain.scale.set(baseMR * expandScale, baseMR * expandScale, baseMR * expandScale);
                    scanRingSecondary.scale.set(baseSR * expandScale, baseSR * expandScale, baseSR * expandScale);
                    scanRingMain.position.y = SCAN_Y_END + fadeProgress * 0.3;
                    scanRingSecondary.position.y = SCAN_Y_END + fadeProgress * 0.25;
                }

                updateParticlePositions(currentTimeSec);
                if (particleSystem) particleSystem.rotation.y *= 0.995;

                if (allParticlesSettled(currentTimeSec) && fadeProgress >= 0.75) {
                    animPhase = ANIM_PHASE.DONE;
                    scanRingMain.visible = false;
                    scanRingSecondary.visible = false;
                    scene.remove(scanRingMain);
                    scene.remove(scanRingSecondary);
                    scanRingMain = null;
                    scanRingSecondary = null;
                    controls.autoRotate = true;
                    bloomPass.strength = 0.7;
                    if (tipEl) tipEl.style.opacity = '1';   // ★ 显示"点击火焰"提示
                    console.log("星辰");
                }
            } else if (animPhase === ANIM_PHASE.DONE) {
                updateParticlePositions(currentTimeSec);
            }

            if (animPhase !== ANIM_PHASE.PRE) {
                backLight.intensity = 0.5 + Math.sin(bgTime * 0.8) * 0.15;
                topHighlight.intensity = 0.25 + Math.sin(bgTime * 1.1) * 0.1;
            }

            // ★ 吹蜡烛 / 冒烟 / 文字 / 烟花 / 重燃
            updateCandleSystem(timestamp, dt);

            controls.update();
            animateBackground();
            effectComposer.render();
        }

        requestAnimationFrame(renderLoop);

        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log("星辰制作");
    </script>
</body>
